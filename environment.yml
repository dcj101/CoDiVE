name: codive
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip>=23
  - setuptools>=68
  - wheel
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - datasets
  - accelerate
  - pandas
  - scikit-learn
  - tqdm
  - pyyaml
  - pillow
  - numpy
  - opencv
  - huggingface_hub
  - pip:
      - transformers==4.49.0
      - tokenizers>=0.21,<0.22
      - decord
      - qwen-vl-utils
      # Optional, install manually if needed and supported by your GPU environment:
      # - unsloth
      # - vllm
